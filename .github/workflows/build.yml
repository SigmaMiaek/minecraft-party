name: Build, test and publish prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install browser testing tools
        run: |
          python3 -m pip install playwright==1.65.2
          python3 -m playwright install --with-deps chromium
      - name: Exercise responsive website and interactions
        run: python3 website/test/browser.py
      - name: Verify public website after Cloudflare Git deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PARTY_WEBSITE_URL: https://minecraft-party.wojciechowskaola57.workers.dev/
        run: python3 website/test/live.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-previews
          path: website/artifacts/
  directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check Worker syntax and directory policy
        run: |
          node --check cloudflare/worker.mjs
          node --test cloudflare/test/registry.test.mjs
      - name: Exercise real local Cloudflare runtime and SQLite binding
        run: python3 cloudflare/test/runtime.py
      - name: Validate deploy bundle without deploying
        working-directory: cloudflare
        run: npx --yes wrangler@4.166.0 deploy --dry-run --outdir ../build/worker
      - name: Verify deployed code service supports ten-player lobbies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 cloudflare/test/live.py
  build:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test directory authorization and expiry
        shell: bash
        run: node --test cloudflare/test/registry.test.mjs
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test including real loopback sockets
        timeout-minutes: 8
        shell: bash
        run: bash gradlew --no-daemon build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: minecraft-party-${{ matrix.os }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            party-core/build/reports/tests/test/
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, directory]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minecraft-party-ubuntu-latest
          path: ci-artifacts
      - name: Publish versioned JAR and checksum as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_release.py --artifacts ci-artifacts
