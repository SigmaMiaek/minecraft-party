plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(':party-core')
    include project(':party-core')
    compileOnly 'org.jetbrains:annotations:26.0.2'
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    clientOnlyMinecraftJar()
    runs {
        client {
            programArgs '--username', providers.gradleProperty('devUsername').getOrElse('PartyDev')
            if (project.hasProperty('quickPlayWorld')) {
                programArgs '--quickPlaySingleplayer', project.property('quickPlayWorld')
            }
        }
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
sourceSets.main.java.srcDir 'vendor/netty-quic/src/main/java'
tasks.withType(JavaCompile).configureEach { options.release = 25 }
jar {
    from('LICENSE')
    from('vendor/netty-quic') {
        include 'LICENSE.txt', 'NOTICE.txt', 'license/**', 'UPSTREAM.md'
        into 'META-INF/licenses/netty-quic'
    }
}
tasks.named('sourcesJar') {
    from('LICENSE')
    from('vendor/netty-quic') {
        include 'LICENSE.txt', 'NOTICE.txt', 'license/**', 'UPSTREAM.md'
        into 'META-INF/licenses/netty-quic'
    }
}
tasks.named('check') { dependsOn ':party-core:test' }
test { useJUnitPlatform() }
